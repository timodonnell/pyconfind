[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyconfind"
version = "0.1.0"
description = "Fast Python implementation of confind — protein side-chain contact-degree analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tim O'Donnell", email = "timodonnell@gmail.com" }]
keywords = [
    "protein", "structure", "bioinformatics", "rotamer", "contact-degree",
    "structural-biology", "confind",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/timodonnell/pyconfind"
Repository = "https://github.com/timodonnell/pyconfind"
Issues = "https://github.com/timodonnell/pyconfind/issues"

[project.optional-dependencies]
# Fast JIT-compiled, multi-threaded contact backend. Optional: the pure
# NumPy/SciPy reference is always available as a fallback.
fast = ["numba>=0.59"]
dev = [
    "numba>=0.59",
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
    "matplotlib>=3.7",
]

[project.scripts]
pyconfind = "pyconfind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyconfind"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
# NumPy/SciPy pragmatism: bare ``np.ndarray`` (without dtype/shape generics) is
# idiomatic in numeric code, and SciPy ships no type stubs. Relax just these two
# so the rest of strict mode (untyped defs, return types, optionals) still bites.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["scipy.*", "numba.*"]
ignore_missing_imports = true
