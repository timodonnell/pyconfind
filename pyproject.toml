[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyconfind"
version = "0.0.1"
description = "Fast Python implementation of confind — protein side-chain contact-degree analysis."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tim O'Donnell", email = "timodonnell@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
pyconfind = "pyconfind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyconfind"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
